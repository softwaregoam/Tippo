project_id = "tippo-dev"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/atur-ulang-password", "http://127.0.0.1:3000/auth/callback", "http://127.0.0.1:3000/atur-ulang-password"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[analytics]
enabled = false

[functions.tippo-doku-pro]
# User authentication on checkout/status/cancel; signed DOKU webhook only.
verify_jwt = false

[functions.tippo-doku-sandbox]
# DOKU has no Supabase JWT. The handler validates DOKU signatures for webhook,
# and verifies the user's JWT with auth.getUser for checkout/status.
verify_jwt = false

[functions.tippo-doku-production-test]
# Authenticated tester allowlist; signed production notifications.
verify_jwt = false

[functions.tippo-doku-snap-test]
# User JWT + tester allowlist for checkout/status. SNAP HMAC for webhook.
verify_jwt = false

[functions.tippo-payment-events]
# Internal HMAC-authenticated receiver; no browser or Supabase user JWT access.
verify_jwt = false
