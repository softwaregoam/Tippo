services:
  router:
    build:
      context: ..
      dockerfile: payment-router/Dockerfile
    restart: unless-stopped
    env_file: .env
    expose: ["8080"]
    volumes: ["router_data:/data"]
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    mem_limit: 256m
    cpus: 0.75
    pids_limit: 64
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
  caddy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    depends_on:
      router: {condition: service_healthy}
    environment:
      ROUTER_DOMAIN: ${ROUTER_DOMAIN:?Set ROUTER_DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
volumes:
  router_data:
  caddy_data:
  caddy_config:
